services:
  backend:
    build: .
    container_name: p2p-backend
    ports:
      - "8080:8080"
    environment:
      - PORT=8080

  nginx:
    image: nginx:stable-alpine
    container_name: p2p-nginx
    depends_on:
      - backend
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
